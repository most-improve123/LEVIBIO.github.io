<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Levi Palacios</title>
  <style>
    :root { --bg: #07090F; --ink: #E8E4DC; --ink2: #9B97A0; --orange: #F7931A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; }
    .code { font-size: 6rem; font-weight: 700; color: var(--orange); line-height: 1; margin-bottom: 1rem; }
    p { color: var(--ink2); margin-bottom: 2rem; }
    a { display: inline-block; padding: 0.7rem 1.5rem; background: var(--orange); color: #07090F; border-radius: 8px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <p>This page doesn't exist.</p>
    <a href="/">Go home</a>
  </div>
</body>
</html>
